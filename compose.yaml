# Runs the published service image. See docs/guides/self-hosting.md.
#
#   Start:   docker compose up -d
#   Update:  docker compose up -d --pull always
#   Stop:    docker compose down
#
# Servers need only this file and a .env file. In a clone of the repository,
# compose.override.yaml adds a local build: docker compose up -d --build

services:
  app:
    # GitHub container registry names are lowercase. APP_VERSION selects the tag.
    image: ghcr.io/guhbots/guhbot.discord:${APP_VERSION:-latest}
    # Settings and secrets passed to the service. List each one here and in
    # .env.example. Docker Compose reads the values from .env in this folder,
    # or from the variables entered in a tool such as Portainer or Unraid.
    # Use ${NAME:?message} for required values, so that a missing one stops
    # the start with a clear error.
    environment:
      APP_VERSION: ${APP_VERSION:-latest}
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env}
      DEV_GUILD_ID: ${DEV_GUILD_ID:-}
      OWNER_GUILD_ID: ${OWNER_GUILD_ID:-}
      MODULES: ${MODULES:-}
      ARCHIVIST_GUILD_IDS: ${ARCHIVIST_GUILD_IDS:-}
      GOOGLE_DRIVE_API_KEY: ${GOOGLE_DRIVE_API_KEY:-}
      # A container must listen on 0.0.0.0 for its published port to reach it.
      ARCHIVIST_HOST: ${ARCHIVIST_HOST:-0.0.0.0}
      ARCHIVIST_PORT: ${ARCHIVIST_PORT:-3000}
      ARCHIVIST_BASE_URL: ${ARCHIVIST_BASE_URL:-http://localhost:3000}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      ARCHIVIST_SESSION_SECRET: ${ARCHIVIST_SESSION_SECRET:-}
      STATUS_CHANNEL_ID: ${STATUS_CHANNEL_ID:-}
      SUPPORT_URL: ${SUPPORT_URL:-}
      WEBSITE_URL: ${WEBSITE_URL:-}
      TOPGG_URL: ${TOPGG_URL:-}
      DISCORDBOTLIST_URL: ${DISCORDBOTLIST_URL:-}
    restart: unless-stopped
    # Runs a small init process that passes stop signals to the service.
    init: true
    volumes:
      - data:/data
    # No ports are published, so a port already in use on the host can never
    # stop the bot from starting. To reach Archivist's website, publish its
    # port as described in docs/guides/self-hosting.md.
    # Limit log size so that logs cannot fill the disk or wear out an SD card.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data:
